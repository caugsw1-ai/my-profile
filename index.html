<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>十年</title>
  <style>
    body {
  margin: 0;
  padding: 32px 18px;
  min-height: 100vh;
  font-family: Arial, "Microsoft YaHei", sans-serif;
  color: #243047;
  background: linear-gradient(135deg, #eef2ff, #f0fdf4);
}

.container {
  max-width: 760px;
  margin: 50px auto;
  padding: 42px;
  background: rgba(255, 255, 255, 0.9);
  border: 1px solid #e5eaf2;
  border-radius: 24px;
  box-shadow: 0 18px 50px rgba(35, 54, 90, 0.12);
}

h1 {
  margin: 0 0 12px;
  color: #243b6b;
  font-size: 42px;
}

.subtitle {
  margin-bottom: 24px;
  color: #54709a;
  font-size: 16px;
  line-height: 1.8;
}

.intro {
  margin-bottom: 28px;
  font-size: 17px;
  line-height: 1.9;
}

.tags {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}

.tag {
  padding: 9px 15px;
  border-radius: 999px;
  background: #eaf2ff;
  color: #31568e;
  font-size: 14px;
}

@media (max-width: 600px) {
  .container {
    margin: 20px auto;
    padding: 28px 22px;
  }

  h1 {
    font-size: 34px;
  }
}
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>十年</h1>
    <div class="subtitle">爱读书 · 运动 · 写作 · 旅行 · 前沿科技</div>

    <div class="intro">
      我是十年，一个兴趣广泛、喜欢不断尝试的人。平时喜欢读书、运动、写作和旅行，也关注前沿科技。<br>
      比起走熟悉的路，我更喜欢挑战那些不容易、少有人尝试的事情。
    </div>

    <div class="tags">
      <div class="tag">读书</div>
      <div class="tag">运动</div>
      <div class="tag">写作</div>
      <div class="tag">旅行</div>
      <div class="tag">前沿科技</div>
    </div>
  </div>
</body>
</html>
