<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>十年</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #f4f7ff, #eefaf6);
      color: #222;
    }

    .container {
      max-width: 800px;
      margin: 80px auto;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 18px;
      padding: 40px 30px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-bottom: 8px;
      font-size: 42px;
      color: #1d3557;
    }

    .subtitle {
      font-size: 18px;
      color: #457b9d;
      margin-bottom: 20px;
    }

    .intro {
      font-size: 18px;
      line-height: 1.8;
      margin-bottom: 30px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .tag {
      background: #e0f2fe;
      color: #075985;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>十年</h1>
    <div class="subtitle">爱读书 · 运动 · 写作 · 旅行 · 前沿科技</div>

    <div class="intro">
      我是十年，一个兴趣广泛、喜欢不断尝试的人。平时喜欢读书、运动、写作和旅行，也关注前沿科技。<br>
      比起走熟悉的路，我更喜欢挑战那些不容易、少有人尝试的事情。
    </div>

    <div class="tags">
      <div class="tag">读书</div>
      <div class="tag">运动</div>
      <div class="tag">写作</div>
      <div class="tag">旅行</div>
      <div class="tag">前沿科技</div>
    </div>
  </div>
</body>
</html>
